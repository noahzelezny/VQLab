<title>VQ Lab Bench</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
<style>[hidden]{display:none!important}
:root{color-scheme:dark;
  --bg:oklch(.12 0 0);--panel:oklch(.16 0 0);--med:oklch(.22 0 0);
  --fg:oklch(.9 0 0);--dim:oklch(.6 0 0);--faint:oklch(.45 0 0);
  --line:oklch(.25 0 0);--grid:oklch(.2 0 0/.3);
  --ok:oklch(.78 .15 150);--warn:oklch(.78 .15 70);--bad:oklch(.68 .19 25);
  --acc:oklch(.80 .14 320);--accfg:oklch(.14 .02 320);--teal:oklch(.82 .14 185);--mix:oklch(.88 .16 98);--pink:oklch(.72 .19 340);
  --glow:0 0 20px oklch(.80 .14 320/.3);
  --g1:oklch(.50 .10 320);--g2:oklch(.66 .13 320);--g3:oklch(.82 .12 320);--g4:oklch(.92 .06 320);
  --r:.375rem}
:root[data-theme="light"]{color-scheme:light;
  --bg:oklch(.97 0 0);--panel:oklch(1 0 0);--med:oklch(.93 0 0);
  --fg:oklch(.2 0 0);--dim:oklch(.45 0 0);--faint:oklch(.6 0 0);
  --line:oklch(.89 0 0);--grid:oklch(.8 0 0/.35);
  --ok:oklch(.5 .14 150);--warn:oklch(.55 .13 70);--bad:oklch(.55 .19 25);
  --acc:oklch(.55 .15 320);--accfg:oklch(1 0 0);--teal:oklch(.5 .11 185);--mix:oklch(.62 .14 98);--pink:oklch(.6 .19 340);--glow:none;
  --g1:oklch(.42 .12 320);--g2:oklch(.58 .14 320);--g3:oklch(.74 .12 320);--g4:oklch(.88 .06 320)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);letter-spacing:.02em;
  font:clamp(13px,calc(.7vw + 4px),15px)/1.5 'JetBrains Mono','SF Mono',ui-monospace,Menlo,monospace;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:40px 40px;background-attachment:fixed}
body:before{content:'';position:fixed;inset:0;pointer-events:none;z-index:100;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,oklch(0 0 0/.03) 2px,oklch(0 0 0/.03) 4px)}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:oklch(.3 0 0);border-radius:3px}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button[disabled]{opacity:.45;cursor:not-allowed}
.ro{font-size:.74em;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.hidden{display:none!important}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

/* ---------- header: logo | pages | library ---------- */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;border-bottom:1px solid var(--line);
  padding:6px 18px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;
  background:color-mix(in oklch,var(--panel) 94%,transparent);backdrop-filter:blur(6px)}
.mark{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;text-shadow:var(--glow);font-size:1.05em;justify-self:center;cursor:pointer}
.mark span{color:var(--acc)}
.mark svg{width:24px;height:24px;overflow:visible;margin-left:2px}
.flow{display:flex;gap:2px}
.st{display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 16px;border-radius:var(--r);color:var(--dim);min-width:6.5em;border:1px solid transparent;position:relative}
.st svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.st .n{font-size:.68em;letter-spacing:.14em;text-transform:uppercase}
.st:hover{color:var(--fg);background:var(--med)}
.st[aria-current=true]{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 40%,transparent);background:color-mix(in srgb,var(--acc) 8%,transparent);text-shadow:var(--glow)}
.st i{position:absolute;top:5px;right:8px;width:6px;height:6px;border-radius:50%;background:transparent}
.st.done i{background:var(--ok)}.st.now i{background:var(--warn);animation:pulse 1.6s infinite}.st.blocked{opacity:.45}
.flow{justify-self:end}
.lib{font-size:.95em;letter-spacing:.16em;text-transform:uppercase;padding:4px 10px;border-radius:var(--r);border:1px solid transparent;color:var(--dim)}
.lib:hover{color:var(--acc)}.lib[aria-current=true]{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 45%,transparent)}

/* ---------- page frame ---------- */
.wrap{max-width:1700px;margin:0 auto;padding-block:18px 32px;padding-inline:clamp(16px,2vw,28px)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:1.2em;min-width:0}
.panel h2{margin:0 0 12px;font-size:.78em;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h2 small{color:var(--faint);letter-spacing:.06em;font-weight:400;text-transform:none}
.jobline{display:flex;align-items:baseline;gap:14px;margin:0 0 14px;flex-wrap:wrap}
.jobline .j{font-weight:700;font-size:1.05em}
.jobline .m{color:var(--faint);font-size:.85em}
.jobline .state{font-size:.72em;letter-spacing:.12em;text-transform:uppercase;padding:1px 7px;border:1px solid;border-radius:2px}
.state.draft{color:var(--acc);border-color:var(--acc)}.state.stopped,.state.queued{color:var(--dim);border-color:var(--line)}.state.failed{color:var(--bad);border-color:var(--bad)}.state.building,.state.gating{color:var(--warn);border-color:var(--warn)}.state.ready{color:var(--ok);border-color:var(--ok)}.state.shipped{color:var(--teal);border-color:var(--teal)}.state.blocked{color:var(--bad);border-color:var(--bad)}
.foot{display:flex;justify-content:flex-end;align-items:center;gap:14px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.foot .hint{color:var(--faint);font-size:.82em;margin-right:auto}
.btn{white-space:nowrap;border:1px solid var(--line);border-radius:var(--r);padding:8px 14px;font-size:.82em;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.btn:hover:not([disabled]){border-color:var(--acc);color:var(--acc)}
.btn.go{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:700}
.btn.go:hover:not([disabled]){filter:brightness(1.1);color:var(--accfg)}
.agent{font-size:.78em;color:var(--faint);margin-top:10px}
.agent b{color:var(--teal);font-weight:400}

/* ---------- lists (jobs, teachers, steps) ---------- */
.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 14px;align-items:baseline;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:6px;background:var(--bg);width:100%;text-align:left}
button.row{cursor:pointer}button.row:hover{border-color:color-mix(in srgb,var(--acc) 50%,transparent)}
.row[aria-selected=true]{border-color:var(--acc);box-shadow:var(--glow)}
.row .n{color:var(--fg);font-weight:700}
.row .meta{color:var(--faint);font-size:.82em;text-align:right;white-space:nowrap}
.row .d{grid-column:1/-1;color:var(--dim);font-size:.84em}
.row .d b{font-weight:400;color:var(--ok)}.row .d i{font-style:normal;color:var(--warn)}
.row .p{grid-column:1/-1;height:3px;background:var(--med);border-radius:2px;overflow:hidden;margin-top:5px}.row .p i{display:block;height:100%;background:var(--acc)}
.row .act{color:var(--acc);font-size:.8em;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.steps{list-style:none;margin:0;padding:0;font-size:.9em}
.steps li{display:grid;grid-template-columns:12px 11em 1fr auto;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps i{width:8px;height:8px;border-radius:50%;background:var(--med);border:1px solid var(--line);justify-self:center;align-self:center}
.steps .ok i{background:var(--ok);border-color:var(--ok)}.steps .run i{background:var(--warn);border-color:var(--warn);box-shadow:0 0 8px var(--warn);animation:pulse 1.6s infinite}.steps .bad i{background:var(--bad);border-color:var(--bad)}
.steps .c{color:var(--fg)}.steps .d{color:var(--dim);font-size:.9em}.steps .t{color:var(--faint);font-size:.85em;white-space:nowrap;text-align:right}
.steps .bad .t{color:var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:.88em;margin:0}
.kv dt{color:var(--faint)}.kv dd{margin:0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:0 0 14px}
.fact{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
.fact b{display:block;font-size:1.15em}.fact small{color:var(--faint);font-size:.74em;letter-spacing:.08em;text-transform:uppercase}
.bytes{display:flex;height:12px;border-radius:2px;overflow:hidden;border:1px solid var(--line);margin:6px 0 4px}
.bytes span{display:block;height:100%}
.key{display:flex;gap:12px;flex-wrap:wrap;font-size:.78em;color:var(--dim);margin:6px 0 0}
.key em{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px;font-style:normal}
.idrow{display:flex;gap:8px;margin-bottom:12px}
.idrow input{flex:1;min-width:0;font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
.home{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:1.4em;align-items:start}
@media(max-width:900px){.home{grid-template-columns:minmax(0,1fr)}}
.empty{color:var(--faint);font-size:.88em;padding:10px 0}

/* ---------- recipe ---------- */
.recipe{display:grid;grid-template-columns:minmax(0,1fr) 30em;gap:1.4em;align-items:start}
.recipe .cart{font-size:.95em}
@media(max-width:900px){.recipe{grid-template-columns:minmax(0,1fr)}}
svg.chart{width:100%;display:block;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);user-select:none;-webkit-user-select:none;touch-action:none}
.chart text{font-family:inherit;fill:var(--faint);font-size:11px}.chart text.atitle{font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.chart .axis{stroke:var(--line)}.chart .gridl{stroke:var(--line);stroke-dasharray:2 4}
.chart .cu{fill:none;stroke-width:1.5}
.chart .cu.flat{stroke:var(--dim)}.chart .cu.mixed{stroke:var(--acc)}.chart .cu.measured{stroke:var(--teal);stroke-dasharray:5 4}
.chart .cu.dimmed{opacity:.3}
.chart .lab.flat{fill:var(--dim)}.chart .lab.mixed{fill:var(--acc)}.chart .lab.measured{fill:var(--teal)}
.chart .rung circle{fill:var(--dim);stroke:var(--bg);stroke-width:1.5}.chart .rung text{fill:var(--faint)}
.chart .notch line{stroke:var(--dim)}.chart .notch text{fill:var(--faint);font-size:11px}
.chart .notch.dimmed{opacity:.35}
.chart .pick{cursor:grab}.chart.drag .pick{cursor:grabbing}
.chart .pick circle{fill:var(--bg);stroke:var(--acc);stroke-width:2.5}.chart .pick text{fill:var(--fg);font-weight:700}.chart .pick line{stroke:var(--acc);stroke-dasharray:2 3}
.chart .cliff{fill:var(--bad);opacity:.06}
.chart .bound{fill:var(--fg);opacity:.05}.chart .boundl{stroke:var(--dim);stroke-dasharray:6 4}.chart .boundt{fill:var(--dim);font-size:11px}
.chart .fits line{stroke:var(--teal);stroke-dasharray:3 3;opacity:.7}.chart .fits text{fill:var(--teal)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.78em;color:var(--faint);margin:8px 2px 0}
.legend i{display:inline-block;width:14px;border-top:2px solid;vertical-align:3px;margin-right:5px}
.strip{display:grid;gap:1px;height:26px;margin:6px 0 2px}
.strip i{display:block;border-radius:1px}
.striplab{display:flex;justify-content:space-between;font-size:.72em;color:var(--faint)}
.cart{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:.88em}
.cart .ro{margin:10px 0 6px}.cart .ro:first-child{margin-top:0}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{flex:1;padding:6px 4px;font-size:.82em;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.seg button[aria-pressed=true]{background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc)}
.seg button:hover{color:var(--fg)}
.seghelp{font-size:.8em;color:var(--faint);margin-top:5px}
.addon{display:grid;grid-template-columns:16px 1fr auto;gap:1px 8px;align-items:center;width:100%;text-align:left;padding:7px 0;border-top:1px solid var(--line);font-size:.9em}
.addon:first-of-type{border-top:0}
.addon i{width:12px;height:12px;border:1px solid var(--line);border-radius:2px;display:inline-block}
.addon[aria-pressed=true] i{background:var(--acc);border-color:var(--acc);box-shadow:var(--glow)}
.addon .n{color:var(--fg)}.addon .t{color:var(--faint);font-size:.85em;white-space:nowrap}.addon .d{grid-column:2/-1;color:var(--faint);font-size:.82em}
.tot{border-top:2px solid var(--line);margin-top:12px;padding-top:10px;display:grid;grid-template-columns:auto 1fr;gap:5px 10px}
.tot .k{color:var(--faint)}.tot .v{text-align:right;font-variant-numeric:tabular-nums}
.tot .big{font-size:1.45em;font-weight:700;color:var(--acc);text-shadow:var(--glow)}
.tbar{display:flex;height:6px;border-radius:2px;overflow:hidden;border:1px solid var(--line);margin:10px 0 4px}
.tbar span{display:block;height:100%}
.tkey{display:flex;gap:10px;flex-wrap:wrap;font-size:.75em;color:var(--dim)}
.tkey em{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;font-style:normal;vertical-align:-1px}
.resolved{background:var(--bg);border:1px solid color-mix(in srgb,var(--teal) 35%,transparent);border-radius:var(--r);padding:10px 12px;margin-top:12px;font-size:.85em}
.resolved .t{color:var(--teal);font-size:.85em;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}
.cmd{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;margin-top:10px;font-size:.8em;white-space:pre-wrap;word-break:break-all;color:var(--dim)}
.lib table{width:100%;border-collapse:collapse;font-size:.86em;font-variant-numeric:tabular-nums}
.lib th{text-align:left;font-weight:400;font-size:.85em;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:4px 8px;border-bottom:1px solid var(--line)}
.lib td{padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}.lib .num{text-align:right}
.tblwrap{overflow-x:auto}
.mix{display:inline-flex;height:10px;width:100px;border-radius:2px;overflow:hidden;vertical-align:middle;border:1px solid var(--line)}.mix span{display:block;height:100%}

.target{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.target button{border:1px solid var(--line);border-radius:var(--r);padding:7px 6px;text-align:center;color:var(--dim);background:var(--bg)}
.target button b{display:block;color:var(--fg);font-size:1.05em}
.target button small{font-size:.75em;color:var(--faint)}
.target button[aria-pressed=true]{border-color:var(--acc);color:var(--acc)}.target button[aria-pressed=true] b{color:var(--acc)}
.target button:hover{border-color:color-mix(in srgb,var(--acc) 50%,transparent)}
.ctx{display:flex;align-items:center;gap:10px;font-size:.85em;color:var(--dim);margin:6px 0 4px}
.ctx input[type=range]{flex:1;accent-color:var(--acc)}
.effort button{display:grid;grid-template-columns:1fr auto;gap:0 10px;width:100%;text-align:left;border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;margin-bottom:4px;background:var(--bg);font-size:.88em}
.effort button .n{color:var(--fg)}.effort button .t{color:var(--faint);white-space:nowrap}.effort button .d{grid-column:1/-1;color:var(--faint);font-size:.85em}
.effort button[aria-pressed=true]{border-color:var(--acc)}.effort button[aria-pressed=true] .n{color:var(--acc)}
.get{border-top:2px solid var(--line);margin-top:12px;padding-top:10px}
.get .r{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:.88em}
.get .k{color:var(--faint)}.get .v{text-align:right;font-variant-numeric:tabular-nums}
.get .v.ok{color:var(--ok)}.get .v.warn{color:var(--warn)}.get .v.bad{color:var(--bad)}
.get .big{font-size:1.4em;font-weight:700;color:var(--acc);text-shadow:var(--glow)}
details.adv{margin-top:12px;font-size:.85em}
details.adv summary{color:var(--faint);cursor:pointer;letter-spacing:.1em;text-transform:uppercase;font-size:.85em}
details.adv .kv{margin-top:8px}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:20px 12em 1fr auto;gap:0 12px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line)}
.timeline li:first-child{border-top:0}
.timeline .m{width:10px;height:10px;border-radius:50%;background:var(--med);border:1px solid var(--line);align-self:center;justify-self:center}
.timeline .ok .m{background:var(--ok);border-color:var(--ok)}.timeline .run .m{background:var(--warn);border-color:var(--warn);box-shadow:0 0 8px var(--warn);animation:pulse 1.6s infinite}.timeline .bad .m{background:var(--bad);border-color:var(--bad)}.timeline .wait .m{background:transparent}
.timeline .c{color:var(--fg)}.timeline .wait .c{color:var(--dim)}.timeline .d{color:var(--dim);font-size:.9em}.timeline .t{color:var(--faint);font-size:.85em;text-align:right;white-space:nowrap}
.timeline .bad .t{color:var(--bad)}
.timeline .sub{grid-column:2/-1;margin:6px 0 0;padding:8px 10px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);font-size:.85em;color:var(--dim)}
.timeline .sub b{color:var(--fg);font-weight:400}
.eta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.eta div{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
.eta b{display:block;font-size:1.15em}.eta small{color:var(--faint);font-size:.74em;letter-spacing:.08em;text-transform:uppercase}

.tsel{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tsel button{border:1px solid var(--line);border-radius:var(--r);padding:5px 10px;font-size:.85em;color:var(--dim);background:var(--bg)}
.tsel button[aria-pressed=true]{border-color:var(--acc);color:var(--acc)}.tsel button:hover{color:var(--fg)}
.tsel button small{color:var(--faint);margin-left:6px}
.chart .box line{stroke:var(--teal);opacity:.5}.chart .box text{fill:var(--teal);font-size:11px}
.chart .box.near line{opacity:1;stroke-width:2}.chart .box.near text{font-weight:700}
.chart .cmp path{fill:none;stroke:var(--bad);stroke-width:1.5}.chart .cmp text{fill:var(--bad)}
.chart .fam circle{stroke:var(--bg);stroke-width:1.5}.chart .fam text{fill:var(--dim);font-size:11px}
.chart .fam.dim{opacity:.25}
.chart .fam path{fill:none;stroke-width:1.2;opacity:.6}
.lib2{display:grid;grid-template-columns:minmax(0,1fr) 22em;gap:1.4em;align-items:start}
.jobs2{display:grid;grid-template-columns:24em minmax(0,1fr);gap:1.4em;align-items:start}
@media(max-width:900px){.jobs2{grid-template-columns:minmax(0,1fr)}}
@media(max-width:900px){.lib2{grid-template-columns:minmax(0,1fr)}}
.rungtab{width:100%;border-collapse:collapse;font-size:.86em;font-variant-numeric:tabular-nums;margin-top:12px}
.rungtab th{text-align:left;font-weight:400;font-size:.85em;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:4px 8px;border-bottom:1px solid var(--line)}
.rungtab td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}.rungtab .num{text-align:right}
.rungtab a{color:var(--teal)}.rungtab a:hover{text-decoration:underline}
.rungtab tr.cmp td{color:var(--bad)}
.rungtab .best{color:var(--ok)}
.jobsel .row{margin-bottom:6px}.jobsel{overflow:auto}.jdet{overflow:auto;padding-right:6px}.timeline.q li{grid-template-columns:20px minmax(0,var(--nw,40ch)) auto;padding:6px 0}.timeline.q .m{grid-row:1}.timeline.q .t{text-align:left;padding-left:3em}.timeline.q .d{grid-column:2/-1;overflow-wrap:anywhere;color:var(--faint)}.timeline.q .d:empty{display:none}.qmeta{color:var(--dim);font-size:.85em;margin:-4px 0 10px}
.stepbar{display:flex;gap:2px;grid-column:1/-1;margin-top:6px}
.stepbar i{flex:1;height:4px;background:var(--med);border-radius:1px}
.stepbar i.ok{background:var(--ok)}.stepbar i.run{background:var(--warn)}.stepbar i.bad{background:var(--bad)}
.seg.small button{padding:4px}

.lib2{grid-template-columns:minmax(0,1fr) 30em}
.lib2 .cart{font-size:.82em;padding:10px 12px}

// Storage helpers (top level): selectors from API keys are escaped
const fldEl=k=>document.querySelector(`.fld[data-fk="${CSS.escape(k)}"]`);

// size the three scrolling panes: read every rect first, then write
function stFit(){const m=$('#fmod'),L=$('#lscroll'),e=$('#sscroll'),h=innerHeight;
  const tm=m&&m.getBoundingClientRect(),tl=L&&L.getBoundingClientRect().top,te=e&&e.getBoundingClientRect().top;
  const mh=m&&Math.max(120,Math.round((h-tm.top-90)*.4));
  if(m)m.style.height=mh+'px';
  if(L)L.style.maxHeight=Math.max(120,h-tl-90)+'px';
  if(e)e.style.maxHeight=Math.max(120,h-(m?te+mh-tm.height:te)-90)+'px'}
async function stSave(k,create){const E=ST.ed[k];if(!E||E.busy||E.value===stOrig(k)&&!E.create)return;
  E.busy=true;E.error='';E.needCreate=false;render();
  const r=await api('/api/settings',{key:k,path:E.value,create:!!(create||E.create)}),j=r.j||{};
  if(r.ok&&j.ok){delete ST.ed[k];document.activeElement?.blur?.();await stLoad();return}
  E.error=r.status?j.error||('request failed ('+r.status+')'):'request failed';E.needCreate=!!r.status&&/exist|no such|not found/i.test(E.error)&&!E.create;
  E.busy=false;if(page===3){render();refocus(k)}}
let pickSeq=0;
async function stPick(k){const E=ST.ed[k]||(ST.ed[k]={value:stOrig(k),error:'',needCreate:false}),tok=E.tok=++pickSeq;
  E.picking=true;
  const r=await api('/api/pick-folder',{start:E.value||stOrig(k)});let j=r.j||{};
  if(!r.status)j={ok:false,error:'folder chooser unavailable'};else if(!r.ok&&!j.error&&!j.cancelled)j={ok:false,error:'folder chooser failed ('+r.status+')'};
  if(ST.ed[k]!==E||E.tok!==tok)return;
  E.picking=false;
  if(j.ok&&j.path){E.value=j.path;E.error='';await stSave(k);return}
  if(!j.cancelled&&j.error)E.error=j.error;
  if(E.value===stOrig(k)&&!E.error&&!E.create)delete ST.ed[k];
  if(page===3)render()}
function wireStorage(){
  stFit();
  {const b=$('#fscan');if(b)b.onclick=fndScan;document.querySelectorAll('#fmod tr.multi').forEach(r=>r.onclick=()=>{const k=r.dataset.gk;FOUND.open.has(k)?FOUND.open.delete(k):FOUND.open.add(k);render()})}

    f.oninput=()=>{const E=ST.ed[k]||(ST.ed[k]={value:o,error:'',needCreate:false});E.value=f.value;f.classList.remove('faint');f.title=f.value};
    f.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();stSave(k)}else if(e.key==='Escape'){e.stopPropagation();if(ST.ed[k]&&!ST.ed[k].busy){stRevert(k);render();const i=fldEl(k);if(i)i.blur()}}};
    f.onblur=()=>{const E=ST.ed[k];if(E&&E.value===o&&!E.error&&!E.busy&&!E.picking&&!E.create)delete ST.ed[k]}});
  document.querySelectorAll('[data-fsave]').forEach(b=>b.onclick=()=>stSave(b.dataset.fsave));

}

function fitLadder(){
