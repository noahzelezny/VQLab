<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VQ Lab Bench</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
<style>[hidden]{display:none!important}
:root{color-scheme:dark;
  --bg:oklch(.12 0 0);--panel:oklch(.16 0 0);--med:oklch(.22 0 0);
  --fg:oklch(.9 0 0);--dim:oklch(.6 0 0);--faint:oklch(.45 0 0);
  --line:oklch(.25 0 0);--grid:oklch(.2 0 0/.3);
  --ok:oklch(.78 .15 150);--warn:oklch(.78 .15 70);--bad:oklch(.68 .19 25);
  --acc:oklch(.80 .14 320);--accfg:oklch(.14 .02 320);--teal:oklch(.82 .14 185);--mix:oklch(.88 .16 98);--pink:oklch(.72 .19 340);
  --glow:0 0 20px oklch(.80 .14 320/.3);
  --g1:oklch(.50 .10 320);--g2:oklch(.66 .13 320);--g3:oklch(.82 .12 320);--g4:oklch(.92 .06 320);
  --r:.375rem}
:root[data-theme="light"]{color-scheme:light;
  --bg:oklch(.97 0 0);--panel:oklch(1 0 0);--med:oklch(.93 0 0);
  --fg:oklch(.2 0 0);--dim:oklch(.45 0 0);--faint:oklch(.6 0 0);
  --line:oklch(.89 0 0);--grid:oklch(.8 0 0/.35);
  --ok:oklch(.5 .14 150);--warn:oklch(.55 .13 70);--bad:oklch(.55 .19 25);
  --acc:oklch(.55 .15 320);--accfg:oklch(1 0 0);--teal:oklch(.5 .11 185);--mix:oklch(.62 .14 98);--pink:oklch(.6 .19 340);--glow:none;
  --g1:oklch(.42 .12 320);--g2:oklch(.58 .14 320);--g3:oklch(.74 .12 320);--g4:oklch(.88 .06 320)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);letter-spacing:.02em;
  font:clamp(13px,calc(.7vw + 4px),15px)/1.5 'JetBrains Mono','SF Mono',ui-monospace,Menlo,monospace;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:40px 40px;background-attachment:fixed}
body:before{content:'';position:fixed;inset:0;pointer-events:none;z-index:100;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,oklch(0 0 0/.03) 2px,oklch(0 0 0/.03) 4px)}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:oklch(.3 0 0);border-radius:3px}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button[disabled]{opacity:.45;cursor:not-allowed}
.ro{font-size:.74em;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.hidden{display:none!important}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

/* ---------- header: logo | pages | library ---------- */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;border-bottom:1px solid var(--line);
  padding:6px 18px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;
  background:color-mix(in oklch,var(--panel) 94%,transparent);backdrop-filter:blur(6px)}
.mark{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;text-shadow:var(--glow);font-size:1.05em;justify-self:center;cursor:pointer}
.mark span{color:var(--acc)}
.mark svg{width:24px;height:24px;overflow:visible;margin-left:2px}
.flow{display:flex;gap:2px}
.st{display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 16px;border-radius:var(--r);color:var(--dim);min-width:6.5em;border:1px solid transparent;position:relative}
.st svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.st .n{font-size:.68em;letter-spacing:.14em;text-transform:uppercase}
.st:hover{color:var(--fg);background:var(--med)}
.st[aria-current=true]{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 40%,transparent);background:color-mix(in srgb,var(--acc) 8%,transparent);text-shadow:var(--glow)}
.st i{position:absolute;top:5px;right:8px;width:6px;height:6px;border-radius:50%;background:transparent}
.flow{justify-self:end}

/* ---------- page frame ---------- */
.wrap{max-width:1700px;width:100%;margin:0 auto;padding-block:14px 12px;padding-inline:clamp(16px,2vw,28px)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.panel h2{margin:0 0 12px;font-size:.78em;letter-spacing:.16em;text-transform:uppercase;color:var(--fg);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.jobline{display:flex;align-items:baseline;gap:14px;margin:0 0 14px;flex-wrap:wrap}
.jobline .j{font-weight:700;font-size:1.05em}
.jobline .m{color:var(--faint);font-size:.85em}
.jobline .state{font-size:.72em;letter-spacing:.12em;text-transform:uppercase;padding:1px 7px;border:1px solid;border-radius:2px}
.state.stopped,.state.queued{color:var(--dim);border-color:var(--line)}.state.failed{color:var(--bad);border-color:var(--bad)}.state.building{color:var(--warn);border-color:var(--warn)}.state.ready{color:var(--ok);border-color:var(--ok)}
.foot{display:flex;justify-content:flex-end;align-items:center;gap:14px;margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
.btn{white-space:nowrap;border:1px solid var(--line);border-radius:var(--r);padding:8px 14px;font-size:.82em;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.btn:hover:not([disabled]){border-color:var(--acc);color:var(--acc)}
.btn.go{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:700}
.btn.go:hover:not([disabled]){filter:brightness(1.1);color:var(--accfg)}

/* ---------- lists (jobs, teachers, steps) ---------- */
.row{display:grid;grid-template-columns:1fr auto;gap:2px 14px;align-items:baseline;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:6px;background:var(--bg);width:100%;text-align:left}
button.row{cursor:pointer}button.row:hover{border-color:color-mix(in srgb,var(--acc) 50%,transparent)}
.row[aria-selected=true]{border-color:var(--acc);box-shadow:var(--glow)}
.row .n{color:var(--fg);font-weight:700}
.row .d{grid-column:1/-1;color:var(--dim);font-size:.84em}
.row .d b{font-weight:400;color:var(--ok)}.row .d i{font-style:normal;color:var(--warn)}
.row .act{color:var(--acc);font-size:.8em;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.key{display:flex;gap:12px;flex-wrap:wrap;font-size:.78em;color:var(--dim);margin:6px 0 0}
.key em{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px;font-style:normal}

/* ---------- recipe ---------- */
.recipe{display:grid;grid-template-columns:minmax(0,1fr) 24em;gap:1.4em;align-items:start}
.recipe .cart{font-size:.95em}
@media(max-width:900px){.recipe{grid-template-columns:minmax(0,1fr)}}
svg.chart{width:100%;display:block;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);user-select:none;-webkit-user-select:none;touch-action:none}
.chart text{font-family:inherit;fill:var(--faint);font-size:11px}.chart text.atitle{font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.chart .axis{stroke:var(--line)}.chart .gridl{stroke:var(--line);stroke-dasharray:2 4}
.chart .cu{fill:none;stroke-width:1.5}
.chart .cu.flat{stroke:var(--dim)}
.chart .notch line{stroke:var(--dim)}.chart .notch text{fill:var(--faint);font-size:11px}
.chart .notch.dimmed{opacity:.35}
.chart .pick{cursor:grab}.chart.drag .pick{cursor:grabbing}
.chart .pick circle{fill:var(--bg);stroke:var(--acc);stroke-width:2.5}.chart .pick text{fill:var(--fg);font-weight:700}.chart .pick line{stroke:var(--acc);stroke-dasharray:2 3}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.78em;color:var(--faint);margin:8px 2px 0}
.legend i:not(.info){display:inline-block;width:14px;border-top:2px solid;vertical-align:3px;margin-right:5px}
.strip{display:grid;gap:1px;height:18px;margin:6px 0 2px}
.strip i{display:block;border-radius:1px}
.striplab{display:flex;justify-content:space-between;font-size:.72em;color:var(--faint)}
.cart{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:.88em}
.cart .ro{margin:8px 0 4px;color:var(--fg);letter-spacing:.1em;display:flex;align-items:center;gap:6px}.cart .ro:first-child{margin-top:0}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{flex:1;padding:6px 4px;font-size:.82em;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.seg button[aria-pressed=true]{background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc)}
.seg button:hover{color:var(--fg)}
.addon{display:grid;grid-template-columns:16px 1fr auto;gap:1px 8px;align-items:center;width:100%;text-align:left;padding:5px 0;border-top:1px solid var(--line);font-size:.9em}
.addon:first-of-type{border-top:0}
.addon i{width:12px;height:12px;border:1px solid var(--line);border-radius:2px;display:inline-block}
.addon[aria-pressed=true] i{background:var(--acc);border-color:var(--acc);box-shadow:var(--glow)}
.addon .n{color:var(--fg)}.addon .t{color:var(--faint);font-size:.85em;white-space:nowrap}.addon .d{grid-column:2/-1;color:var(--faint);font-size:.82em}
.cmd{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;margin-top:10px;font-size:.8em;white-space:pre-wrap;word-break:break-all;color:var(--dim)}


.chart .box line{stroke:var(--teal);opacity:.5}.chart .box text{fill:var(--teal);font-size:11px}
.chart .box.near line{opacity:1;stroke-width:2}.chart .box.near text{font-weight:700}
.jobs2{display:grid;grid-template-columns:24em minmax(0,1fr);gap:1.4em;align-items:start}
@media(max-width:900px){.jobs2{grid-template-columns:minmax(0,1fr)}}
.rungtab{width:100%;border-collapse:collapse;font-size:.86em;font-variant-numeric:tabular-nums}
.rungtab th{text-align:left;font-weight:400;font-size:.85em;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:4px 8px;border-bottom:1px solid var(--line)}
.rungtab td{padding:4px 8px;border-bottom:1px solid var(--line);white-space:nowrap}.rungtab .num{text-align:right}
.rungtab a{color:var(--teal)}.rungtab a:hover{text-decoration:underline}
.rungtab .best{color:var(--ok)}
.jobsel .row{margin-bottom:6px}.jobsel{overflow:auto}.jdet{overflow:auto;padding-right:6px}.qmeta{color:var(--dim);font-size:.85em;margin:-4px 0 10px}
.stepbar{display:flex;gap:2px;grid-column:1/-1;margin-top:6px}
.stepbar i{flex:1;height:4px;background:var(--med);border-radius:1px}
.stepbar i.ok{background:var(--ok)}.stepbar i.run{background:var(--warn)}.stepbar i.bad{background:var(--bad)}
.seg.small button{padding:4px}

.rungtab thead th{position:sticky;top:0;background:var(--panel)}
.chart .cu.aff{stroke:var(--bad);stroke-dasharray:5 4}

.rungtab td.what{white-space:nowrap;max-width:24em;overflow:hidden;text-overflow:ellipsis}
.modeseg{margin-bottom:10px}.modeseg button{font-weight:700}

/* knurlogic-style strategy switch: a strip, and a bordered box that says what the choice trades */
.kseg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--bg)}
.kseg button{flex:1;padding:6px 4px;font-size:.82em;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.kseg button small{display:block;font-size:.7em;letter-spacing:.06em;color:var(--faint);text-transform:none}
.kseg button[aria-pressed=true]{background:var(--acc);color:var(--accfg)}.kseg button[aria-pressed=true] small{color:var(--accfg);opacity:.8}
.kseg button:hover:not([aria-pressed=true]){color:var(--fg)}
.kseg.small button{padding:5px 4px;font-size:.76em}
/* readouts above the chart */
.readouts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:8px}
.readout{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:4px 9px;min-width:0}
.readout b{display:block;font-size:1.05em;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.readout.acc b{color:var(--acc);text-shadow:var(--glow)}.readout.ok b{color:var(--ok)}.readout.box b{color:var(--teal)}.readout.bad b{color:var(--bad)}.readout.warn b{color:var(--warn)}
.readout small{color:var(--faint);font-size:.66em;letter-spacing:.1em;text-transform:uppercase;display:block;white-space:nowrap}
.readout .sub{color:var(--dim);font-size:.72em;margin-top:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:1100px){.readouts{grid-template-columns:repeat(3,1fr)}}
/* teacher button + picker overlay, after knurlogic's model picker */
.modal{position:fixed;inset:0;z-index:50;background:oklch(0 0 0/.6);display:flex;align-items:center;justify-content:center;padding:40px 24px}
.modal .box{width:min(960px,100%);height:min(640px,82vh);display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);box-shadow:0 20px 60px oklch(0 0 0/.6);overflow:hidden}
.pickhd{display:flex;align-items:center;gap:14px;padding:12px 14px;border-bottom:1px solid var(--line)}
.pickhd input{flex:1;background:transparent;border:0;font:inherit;color:var(--fg);font-size:1em}.pickhd input:focus{outline:none}
.pickhd .x{color:var(--faint);font-size:1.2em;padding:0 6px}.pickhd .x:hover{color:var(--warn)}
.pickbody{display:grid;grid-template-columns:150px 1fr;min-height:0;flex:1}
.pfams{border-right:1px solid var(--line);overflow:auto;padding:6px 0}
.pfam{display:block;width:100%;text-align:left;padding:8px 12px;font-size:.82em;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);border-left:2px solid transparent}
.pfam:hover{color:var(--fg)}.pfam[aria-current=true]{color:var(--acc);border-left-color:var(--acc);background:color-mix(in srgb,var(--acc) 7%,transparent)}
.pfam i{font-style:normal;color:var(--faint);float:right}
.prows{overflow-y:scroll}
.psect{padding:8px 14px;font-size:.76em;letter-spacing:.1em;text-transform:uppercase;color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,transparent);border-bottom:1px solid var(--line)}
.psect.no{color:var(--faint);background:transparent}
.prow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line)}
.prow:hover{background:var(--med)}.prow[aria-current=true] .n{color:var(--acc)}
.prow .n{color:var(--fg)}.prow .m{color:var(--faint);font-size:.82em;white-space:nowrap}.prow .d{grid-column:1/-1;color:var(--dim);font-size:.82em}
.prow.no{opacity:.5}
.pfsep{height:1px;background:var(--line);margin:6px 12px}
.modal .box{position:relative}
.hfrow.no .prow{opacity:.55}
.hfdlg{position:absolute;inset:0;z-index:5;background:oklch(0 0 0/.6);display:flex;align-items:center;justify-content:center;padding:20px}
.hfbox{width:min(300px,100%);min-height:160px;padding:14px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);box-shadow:0 20px 60px oklch(0 0 0/.6)}
.hfttl{font-weight:700;overflow-wrap:anywhere}.hfsz,.hfnote,.vs{color:var(--dim);font-size:.82em}.hfnote{flex:1}
.hfbtns{display:flex;justify-content:flex-end;gap:10px;margin-top:auto}
.mini{padding:2px 10px;border:1px solid var(--line);border-radius:var(--r);color:var(--fg);font-size:.82em}.mini:hover:not([disabled]){border-color:var(--acc);color:var(--acc)}.mini[disabled]{opacity:.4;cursor:default}
.mini.pri{color:var(--acc);border-color:var(--acc)}
.tag{font-size:.72em;letter-spacing:.08em;padding:0 5px;border:1px solid var(--warn);color:var(--warn);border-radius:var(--r)}
.st .badge{position:absolute;top:2px;right:6px;min-width:1.6em;padding:0 5px;border-radius:8px;text-align:center;background:var(--acc);color:var(--accfg);font-size:.8em}.badge.off{visibility:hidden}
.jdbox{width:min(640px,100%);max-height:90vh;min-height:0}.jdsteps{overflow:auto;max-height:28vh;min-height:4em}.jstep{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) 3em 6em;gap:10px;padding:3px 0;border-top:1px solid var(--line);font-size:.85em}.jstep>*{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.jstep .m{color:var(--faint)}.jstep .t{text-align:right}.jdwarn{color:var(--warn)}.jdbad{color:var(--bad);overflow-wrap:anywhere}
.dlbox{width:min(560px,100%)!important;height:min(420px,70vh)!important}
.dlbody{flex:1;overflow:auto;padding:8px 14px}
.dlrow{padding:8px 0;border-bottom:1px solid var(--line)}
.dlhd{display:flex;align-items:center;gap:10px}.dlhd .vn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlhd .mini svg{width:13px;height:13px;display:block}
.lbar{height:3px;background:var(--line);border-radius:2px;margin:5px 0 3px;overflow:hidden}.lbar i{display:block;height:100%;background:var(--acc);transition:width .4s}

.hpick{min-width:9em;text-align:left;font-size:1.25em;letter-spacing:.02em;text-transform:none;color:var(--fg);font-weight:700;padding:0 4px;border-bottom:1px dashed var(--line)}
.hpick:hover{color:var(--acc);border-bottom-color:var(--acc)}.hpick span{color:var(--faint);font-size:.8em}
/* one screen: tighter vertical budget on the recipe page */
.readouts.r3{grid-template-columns:repeat(3,1fr)}
.recipe .legend{margin-top:6px}
.rl .rohd.mid{font-size:.68em;margin:8px 0 2px}.recipe .cart .ro{font-size:.68em}.rl .readouts{margin-bottom:8px}
.pkind{padding:8px 14px;border-bottom:1px solid var(--line)}

/* (i): ported from Knurlogic page.css (.info/.bub) + ui/overlay.js placeInfo */
.info{position:relative;display:inline-block;flex:none;cursor:help;
  width:13px;height:13px;line-height:12px;border:1px solid var(--line);
  border-radius:50%;text-align:center;font-size:11px;font-style:normal;
  color:var(--faint);text-transform:none;letter-spacing:0;
  vertical-align:middle;margin-left:5px}
.info:hover,.info:focus{color:var(--acc);border-color:var(--acc);outline:0}
.info .bub{display:block;visibility:hidden;position:fixed;left:0;top:0;
  z-index:60;max-height:calc(100vh - 16px);overflow:auto;width:17em;padding:7px 9px;background:var(--bg);
  border:1px solid var(--line);border-radius:var(--r);color:var(--dim);
  font-size:13px;line-height:1.45;text-align:left;white-space:normal;
  box-shadow:0 4px 16px oklch(0 0 0/.5);cursor:default}
.info:hover .bub,.info:focus .bub,.info:focus-within .bub{visibility:visible}
.bitrow{display:grid;grid-template-columns:9em 1fr;gap:10px;align-items:center;font-size:.88em;padding:3px 0}.bitrow span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bitrow input[type=range]{width:100%;accent-color:var(--acc)}
.bitrow .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--fg)}

.ladder{margin-top:10px;font-size:.88em}.ladder td{padding:6px 8px}
.ladder tr.affine td{color:var(--dim)}.ladder tr.vq td:first-child{color:var(--fg)}.faint{color:var(--faint)}
.ladder{table-layout:fixed}.ladder th,.ladder td{padding:0 10px;white-space:nowrap}.ladder td{overflow:hidden;text-overflow:ellipsis;padding-top:6px;padding-bottom:6px}.ladder th{padding-top:4px;padding-bottom:4px;letter-spacing:.04em}.ladder td.what{max-width:none}.ladder td.num,.ladder th.num{text-align:right}.ladder td.lnk,.ladder th.lnkh{text-align:left;padding-left:16px}.ladder .gtog{margin-left:3px;padding:0 2px;border:0;background:none;color:var(--dim);font:inherit;cursor:pointer;line-height:1}.ladder .gtog:hover{color:var(--acc)}
.ladder th.sort{cursor:pointer;user-select:none}.ladder th.sort:hover{color:var(--fg)}

.lib3{display:grid;grid-template-columns:minmax(0,1fr) 34em;gap:1.4em;align-items:start}
@media(max-width:1100px){.lib3{grid-template-columns:minmax(0,1fr)}}
.libpage h2{align-items:center}
.ladder tbody tr{cursor:pointer}.ladder tbody tr:hover td{background:color-mix(in oklch,var(--fg) 4%,transparent)}.ladder tr.sel td{background:color-mix(in oklch,var(--acc) 12%,transparent)}
#libchart .pt{cursor:pointer}
.insp{font-size:.92em;padding:12px 16px}.insp .ro{margin:9px 0 4px}
.ihead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.iact{display:flex;gap:6px;margin-left:auto;flex:none}.iact .btn{padding:5px 10px}.iname{font-weight:700;font-size:1.1em;color:var(--fg);word-break:break-all}

// ---- per-teacher models, all derived from the measured rows at load
function lsq(pts){const n=pts.length,mx=pts.reduce((a,p)=>a+p[0],0)/n,my=pts.reduce((a,p)=>a+p[1],0)/n;const b=pts.reduce((a,p)=>a+(p[0]-mx)*(p[1]-my),0)/(pts.reduce((a,p)=>a+(p[0]-mx)**2,0)||1);return [my-b*mx,b]}
function derive(t){
  const R=t.rows.filter(r=>r.kl);t.scored=R;
  if(!R.length){t.g0=0;t.g1=t.rows[0].gib/t.rows[0].bpw;t.bpw=g=>g/t.g1;t.klFlat=g=>NaN;t.klAff=null;t.xr=[t.rows[0].gib*0.6,t.rows[t.rows.length-1].gib*1.5];return}
  // bytes <-> bpw is linear per family; the intercept is the non-quantized carry
  [t.g0,t.g1]=lsq(R.map(r=>[r.bpw,r.gib]));
  t.bpw=g=>(g-t.g0)/t.g1;
  // curves: KL = A·e^(-b·bpw) + floor. The floor is chosen by grid search on
  // residuals, A and b by least squares in log space; shipped rows count
  // double. No cliff term: nothing in the measured range shows one.
  function fitExp(rows){if(rows.length<2)return null;let best=null;const kmin=Math.min(...rows.map(r=>mean(r.kl)));
    for(let f=0;f<kmin*0.95;f+=Math.max(0.25,kmin*0.02)){const pts=[];rows.forEach(r=>{const w=r.kind==='vq'?2:1;for(let i=0;i<w;i++)pts.push([r.bpw,Math.log(mean(r.kl)-f)])});
      const [a,b]=lsq(pts);const res=rows.reduce((acc,r)=>acc+(r.kind==='vq'?2:1)*(Math.log(Math.exp(a+b*r.bpw)+f)-Math.log(mean(r.kl)))**2,0);if(!best||res<best.res)best={res,a,b,f}}
    return g=>Math.exp(best.a+best.b*t.bpw(g))+best.f}
  const flat=R.filter(r=>(r.kind==='vq'||r.kind==='lab')&&!r.mixed),allvq=R.filter(r=>r.kind==='vq'||r.kind==='lab');
  t.klFlat=(flat.length>=3?fitExp(flat):fitExp(allvq))||(g=>{const r=allvq[0];return mean(r.kl)*Math.exp(-0.9*(t.bpw(g)-r.bpw))});
  t.klAff=fitExp(R.filter(r=>r.kind==='affine'));
  const gs=R.map(r=>r.gib);t.xr=[Math.min(...gs)*0.85,Math.max(...gs)*1.12];
}
LIB_ROWS.forEach(derive);

async function loadFleet(){

  FLEET.data=Array.isArray(a)?a:[];SCORES.data=okS?sc.j:[];
  // per published repo, the copy under its own org's root wins, else the newest scan
  const inRoot=x=>(x.name||'').startsWith(org(x.hf_repo)+'--'),nr={};
  for(const x of newestBy(FLEET.data,x=>x.hf_repo||null,(x,c)=>inRoot(x)!==inRoot(c)?inRoot(x):newer(x,c))){const h=x.hub,b=x.bundle||{};
    nr[x.hf_repo]={geo:x.geometry||{},sz:x.skipzero,text:x.text_gib,profile:x.runtime&&x.runtime.profile,shards:x.shards,drift:h?(h.drift||[]).filter(d=>d.state!=='same').map(d=>d.file):null,checked:h&&h.checked?h.checked.slice(0,10):'',rev:h&&h.revision?h.revision.slice(0,7):'',scanned:x.scanned,verdict:b.verdict||'',note:b.note||''}}

function famOf(x){

const pubOrgs=()=>new Set(LIB_ROWS.flatMap(t=>t.rows.filter(r=>(r.kind==='vq'||r.kind==='lab')&&r.hf).map(r=>org(r.hf))));

function ownBuildsCalc(){

    const sc=SCORES.data.filter(r=>r.fingerprint===x.fingerprint),md5=x.runtime&&x.runtime.md5,cells={};
    for(const c of ['prose','code','lit']){const l=sc.filter(r=>r.corpus===c),m=md5?l.filter(r=>String(r.runtime||'').startsWith(md5)):[],pool=m.length?m:l;
      const best=[...pool].sort((p,q)=>String(q.time).localeCompare(String(p.time)))[0];if(best&&best.kl_mnats!=null)cells[c]={...best,other:!!md5&&!m.length}}

// continuous drag. Flat: the nearest geometry. Mixed: a body geometry and the next richer geometry

// Each candidate is scored by how far its size lands from the pointer, plus a small cost per setting it

// a finished download: the server rescans, so find its row among the unprofiled originals and profile it

  if(dl.onbP)return dl.onbP;dl.onbP=(async()=>{await null;try{
    for(const repo of [...dl.onb.keys()]){
      await loadTeachers();await TEACH.p;if(!dl.onb.has(repo))continue;
      if(TEACH.data.some(t=>t.name===repo)){dl.onb.delete(repo);continue}
      const u=TEACH.unp.find(x=>x.name===repo);
      if(u){dl.onb.delete(repo);profileStart(u.path)}
      else if(Date.now()-dl.onb.get(repo)>T.onbGiveUp){dl.onb.delete(repo);dl.errs[repo]='not found by the model scan; rescan in Storage'}

}

// selectors from API keys are escaped
const fldEl=k=>document.querySelector(`.fld[data-fk="${CSS.escape(k)}"]`);
const refocus=k=>{const i=fldEl(k);if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}};
async function stSave(k,create){const E=ST.ed[k];if(!E||E.busy||E.value===stOrig(k)&&!E.create)return;
  E.busy=true;E.error='';E.needCreate=false;render();
  const r=await api('/api/settings',{key:k,path:E.value,create:!!(create||E.create)}),j=r.j||{};
  if(isOk(r)){delete ST.ed[k];document.activeElement?.blur?.();await stLoad();return}
  E.error=r.status?j.error||errOf(r):'request failed';E.needCreate=!!r.status&&/exist|no such|not found/i.test(E.error)&&!E.create;
  E.busy=false;if(UI.page===P.storage){render();refocus(k)}}
let pickSeq=0;
async function stPick(k){const E=ST.ed[k]||(ST.ed[k]={value:stOrig(k),error:'',needCreate:false}),tok=E.tok=++pickSeq;
  E.picking=true;
  const r=await api('/api/pick-folder',{start:E.value||stOrig(k)});let j=r.j||{};
  if(!r.status)j={ok:false,error:'folder chooser unavailable'};else if(!r.ok&&!j.error&&!j.cancelled)j={ok:false,error:'folder chooser failed ('+r.status+')'};
  if(ST.ed[k]!==E||E.tok!==tok)return;
  E.picking=false;
  if(j.ok&&j.path){E.value=j.path;E.error='';await stSave(k);return}
  if(!j.cancelled&&j.error)E.error=j.error;
  if(E.value===stOrig(k)&&!E.error&&!E.create)delete ST.ed[k];
  if(UI.page===P.storage)render()}
async function stCopy(){
  try{await navigator.clipboard.writeText((ST.rec.rm_lines||[]).join('\n'));ST.copied=true}
  catch{const t=$('.rmblk');if(t){const r=document.createRange();r.selectNodeContents(t);getSelection().removeAllRanges();getSelection().addRange(r);try{document.execCommand('copy');ST.copied=true}catch{}}}
  render();later(ST,T.copied,()=>{ST.copied=false;if(UI.page===P.storage)render()})}

// ================================================================ pages: wiring and navigation
function fitLadder(){
  const tb=document.querySelector('table.ladder');if(!tb)return;const w=tb.parentElement;
  const cols=[...tb.querySelectorAll('col[data-w]')],bc=tb.querySelector('col[data-build]');
  const em=parseFloat(getComputedStyle(tb).fontSize),tot=cols.reduce((a,c)=>a+ +c.dataset.w,0);
  /* build width is fitted to the collapsed table (57em), so expanding a group never moves existing columns; extra width scrolls */const over=57-w.clientWidth/em,bw=Math.max(9,Math.min(15,15-Math.max(0,over)));
  bc.style.width=bw+'em';tb.style.minWidth=(tot-15+bw)+'em'}
const PG=[pgLibrary,pgRecipe,pgJobs,pgStorage];
// page-specific drawing after the markup is in (no state changes here)
function wireLibrary(){drawLib();fitLadder()}
function wireRecipe(){
  if(!curT())return;
  drawRecipe();drawStrip();drawReadouts();drawPlan();
}
const WIRE=[wireLibrary,wireRecipe];
function render(){
  pruneModals();renderFlow();
  $('#page').innerHTML=PG[UI.page]();
  if(WIRE[UI.page])WIRE[UI.page]();   // Jobs and Storage are pure markup: their clicks are delegated
}
const redraw=()=>{save();render()};
// the loads a page needs when it is entered (a scan that was running resumes on return to Storage)
function enter(p){
  if(p===P.recipe){if(Date.now()-TEACH.at>T.teachStale)loadTeachers();pvKick()}
  if(p===P.lib&&Date.now()-FLEET.at>T.fleetStale)loadFleet();
  if(p===P.storage){if(!ST.started){ST.started=true;stLoad()}if(FOUND.scanning&&!FOUND.timer&&!FOUND.inflight)fndLoad()}
}
function go(p){
  if(UI.page===P.storage&&p!==P.storage)stDrop();
  UI.page=p;enter(p);redraw();
}
function renderFlow(){
  $('#flow').innerHTML=PAGES.map((p,i)=>(p.k==='storage'?`<button class="st" data-dl>${ICON.download}<span class="n">Downloads</span><span class="badge off" id="dlbadge"></span></button>`:'')+`<button class="st" aria-current="${i===UI.page}" data-i="${i}">${ICON[p.k]}<span class="n">${p.n}</span>${p.k==='jobs'?'<i class="on"></i>':''}</button>`).join('');
  dlRender();
}

// ---- clicks, answered by delegation on #page
// Library
on('sel',(el,e)=>{if(e.target.closest('a'))return;lib.sel=el.dataset.sel;render()});
on('grp',el=>{const g=el.dataset.grp;lib.cols[g]=!lib.cols[g];if(!lib.cols[g]&&(g==='kl'?['p','c','l']:['bx','ba','be','br']).includes(lib.sort.k))lib.sort={k:g==='kl'?'m':'b',d:1};redraw()});
on('ltab',el=>{lib.tab=el.dataset.ltab;redraw()});
on('fork',el=>{const t=TE(lib.fam),r=t.rows.find(q=>q.id===el.dataset.fork),lv=liveFor(t);if(lv)openRecipe(lv.id,r.geo)});
on('sort',el=>{const k=el.dataset.sort;
  if(UI.page===P.storage)ST.sort=toggleSort(ST.sort,k,k==='name'?1:-1);else lib.sort=toggleSort(lib.sort,k,1);
  render()});
// the picker (Library and Recipe)
on('pick',()=>{openModal($('#picker'));renderPicker();$('#psearch').focus();if(UI.page===P.recipe)loadTeachers()});
on('pclose',()=>closeModal($('#picker')));
on('pf',el=>{pickFam=el.dataset.pf;renderPicker()});
on('pk',el=>{pickKind=el.dataset.pk;renderPicker()});
on('prof',el=>profileStart(el.dataset.prof));
on('pt',el=>pickTeacher(el.dataset.pt));
on('hf',el=>{HF.open=el.dataset.hf;hubDialog()});
// Recipe
const chg=fn=>{const t=curT();if(!t)return;fn(t);sanitize(t);ensureName();pvKick();redraw()};
on('g',el=>chg(t=>{const d=recipe.draft,g=el.dataset.g,v=el.dataset.v;
  if(v===undefined)d[g]=!d[g];
  else if(g==='mode')d.mode=v;
  else if(g==='strat'){const at=sizeOf(t,d).gib;d.tailOn=v==='tail';if(d.tailOn){const fg=fitGeos(t).map(x=>x.geo);d.tailGeo=fg[Math.min(fg.length-1,fg.indexOf(d.geo)+1)]}resolveAt(t,d,at)}
  else d[g]=+v}));
on('nav',el=>chg(t=>{const d=+el.dataset.d,k=el.dataset.nav,r=recipe.draft;
  if(k==='tfrom')r.tailFrom+=d;
  else{const fg=fitGeos(t).map(x=>x.geo);r[k]=fg[Math.max(0,Math.min(fg.length-1,fg.indexOf(r[k])+d))]}}));
on('queue',reviewBuild);
on('savejson',()=>{const t=curT();if(!t)return;const u=URL.createObjectURL(new Blob([JSON.stringify(recipeOf(t,recipe.draft),null,1)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='recipe.json';a.click();URL.revokeObjectURL(u)});
// Jobs
on('step',el=>{const d=$('.jdet'),y=d&&d.scrollTop;jobs.stepOpen=jobs.stepOpen===el.dataset.step?'':el.dataset.step;render();const e=$('.jdet');if(e)e.scrollTop=y});
on('job',el=>{jobs.sel=el.dataset.job;jobs.note=null;redraw()});
on('pre',()=>{jobs.showPre=!jobs.showPre;redraw()});
on('qact',el=>{const a=el.dataset.qact,q=LIVE.queues.find(x=>x.id===el.dataset.qid);
  if(a==='start-file')jdOpen({kind:'start',body:{file:el.dataset.file},plan:null,err:'',busy:false});
  else if(q)jdOpen({kind:a==='full'?'start':a,name:q.name,body:{id:q.id},plan:null,err:'',busy:false})});
// Storage
on('fscan',fndScan);
on('gk',el=>{const k=el.dataset.gk;FOUND.open.has(k)?FOUND.open.delete(k):FOUND.open.add(k);render()});
on('sadv',()=>{UI.stAdv=!UI.stAdv;redraw()});
on('stab',el=>{ST.tab=el.dataset.stab;render()});
on('fsave',el=>stSave(el.dataset.fsave));
on('fcreate',el=>stSave(el.dataset.fcreate,true));
on('fpick',el=>{el.disabled=true;el.classList.add('busy');stPick(el.dataset.fpick)});
on('scopy',stCopy);

// ---- inputs and keys on #page
function recipeName(nm){
  const d=recipe.draft;d.name=nm.value;d.nameSet=true;const ok=NAME_RE.test(d.name);
  nm.classList.toggle('bad',!ok);$('#queue').disabled=!ok||recipe.rb.busy;$('#savejson').disabled=!ok;
  pvKick();save();drawReadouts();drawPlan()}
function stInput(f){const k=f.dataset.fk,E=ST.ed[k]||(ST.ed[k]={value:stOrig(k),error:'',needCreate:false});E.value=f.value;f.classList.remove('faint');f.title=f.value}
function stBlur(k){const E=ST.ed[k];if(E&&E.value===stOrig(k)&&!E.error&&!E.busy&&!E.picking&&!E.create)delete ST.ed[k]}
const isFld=el=>el.dataset&&el.dataset.fk!==undefined;
const pageEl=$('#page');
delegate(pageEl,'click',CLICK);
pageEl.addEventListener('input',e=>{const el=e.target;
  if(el.id==='psearch')pickSearch();else if(el.id==='rname')recipeName(el);else if(isFld(el))stInput(el)});
pageEl.addEventListener('keydown',e=>{const el=e.target;
  if(isFld(el)){const k=el.dataset.fk;
    if(e.key==='Enter'){e.preventDefault();stSave(k)}
    else if(e.key==='Escape'){e.stopPropagation();if(ST.ed[k]&&!ST.ed[k].busy){stRevert(k);render();const i=fldEl(k);if(i)i.blur()}}}
  else if(e.key==='Enter'&&el.matches&&el.matches('div[data-pt]'))CLICK.pt(el,e)});
pageEl.addEventListener('focusout',e=>{if(isFld(e.target))stBlur(e.target.dataset.fk)});
// dragging the recipe point along the geometry notches
pageEl.addEventListener('pointerdown',e=>{const svg=e.target.closest&&e.target.closest('#chart');
  if(!svg||!curT())return;
  e.preventDefault();recipe.dragXr=recipeGeom(curT()).xr;recipe.restHi=restHi(curT());recipe.cands=pricedCands(curT(),recipe.draft);recipe.reach=reach(curT(),recipe.draft,recipe.cands);svg.classList.add('drag');svg.setPointerCapture(e.pointerId);chartDrag(e)});
pageEl.addEventListener('pointermove',e=>{const svg=$('#chart');if(svg&&svg.classList.contains('drag'))chartDrag(e)});
const dragEnd=()=>{const svg=$('#chart');if(!svg||!svg.classList.contains('drag'))return;
  svg.classList.remove('drag');recipe.view={key:recipe.draft.teacher+'|'+recipe.draft.mode,xr:recipe.dragXr};recipe.dragXr=null;ensureName();sanitize(curT());pvKick();redraw()};
pageEl.addEventListener('pointerup',dragEnd);pageEl.addEventListener('pointercancel',dragEnd);

// ---- header, overlays, start-up
delegate($('#flow'),'click',{i:el=>go(+el.dataset.i),dl:dlOpen});
$('#homebtn').onclick=()=>go(P.lib);
document.body.insertAdjacentHTML('beforeend','<div class="modal hidden" id="dlov"><div class="box dlbox"><div class="pickhd"><span class="ro">Downloads</span><span class="sp"></span><button class="x" id="dlx" aria-label="close">×</button></div><div class="dlbody" id="dllist"></div></div></div><div class="modal hidden" id="jdlg"></div>');
$('#dlx').onclick=()=>closeModal($('#dlov'));
delegate($('#dllist'),'click',{stop:el=>dlAct('stop',el.dataset.stop),resume:el=>dlAct('start',el.dataset.resume),onb:el=>{const id=el.dataset.onb;dl.onb.set(id,Date.now());dlRender();dlOnb().then(dlNext)}});
$('#jdlg').addEventListener('click',e=>{const b=e.target.closest('[data-jd]'),k=b&&b.dataset.jd;if(k==='cancel')closeModal($('#jdlg'));else if(k==='ok')jdOk()});
const RZ={timer:0};
addEventListener('resize',()=>later(RZ,T.resize,()=>{if(UI.page<=P.recipe)render()}));
libPick();render();
loadFleet();poll();loadTeachers();fndLoad();dlLoad();if(UI.page===P.storage)enter(P.storage);
setInterval(()=>{if(UI.page===P.jobs||!LIVE.on)poll();if(UI.page===P.lib&&Date.now()-FLEET.at>T.fleetStale)loadFleet()},T.poll);

</script>
