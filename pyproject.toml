[build-system]
requires = ["setuptools>=77"]  # PEP 639 license / license-files
build-backend = "setuptools.build_meta"

[project]
name = "vqlab"
version = "0.1.0"
description = "Size-targeted, data-free vector quantization of large models on Apple Silicon (MLX)"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["quantization", "vector-quantization", "mlx", "apple-silicon", "llm"]
authors = [{ name = "Noah Zelezny (TheDrainFlorist)" }]
maintainers = [{ name = "Noah Zelezny (TheDrainFlorist)" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
# Tested with the newest releases inside these ranges (scripts/ci.sh installs
# them; `vqlab doctor` prints the versions a run actually used). The runtime
# bundled into every artifact (runtime/vq_switch.py) calls mlx Metal-kernel APIs, so mlx
# is capped at the next minor until CI has run on it.
dependencies = [
    "mlx>=0.32.0,<0.33",
    "mlx-lm>=0.31.0,<0.33",
    "numpy>=2.0",
    "safetensors>=0.4",
    # Hub downloads and HF-cache teachers (the GUI's Downloads, recipe sources)
    "huggingface_hub>=0.23",
    # the architecture files (deepseek_v4, qwen4_exp, ...) and the runtime the
    # artifacts are served by: one copy, vqlab.family.arch loads them
    "knurlogic>=0.1.3",
]

[project.optional-dependencies]
# kl/ppl scoring and check-release's tokenizer round-trip
score = ["transformers>=4.57"]
# the image smoke (vision-smoke, check-release on an artifact with a tower)
vision = ["mlx-vlm>=0.5", "transformers>=4.57", "pillow"]
test = ["pytest", "ruff>=0.16,<0.17", "pylint", "build"]

[project.urls]
Homepage = "https://github.com/noahzelezny/VQLab"
Changelog = "https://github.com/noahzelezny/VQLab/blob/master/CHANGELOG.md"
Paper = "https://doi.org/10.5281/zenodo.22119017"
Repository = "https://github.com/noahzelezny/VQLab"
Documentation = "https://github.com/noahzelezny/VQLab/tree/master/docs"
Issues = "https://github.com/noahzelezny/VQLab/issues"
Models = "https://huggingface.co/TheDrainFlorist"

[project.scripts]
vqlab = "vqlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
# gui_static/ is data only: the GUI page, index.html, served at /. Its
# source, bench/ (bench.html, build script, JSON), is never packaged.
exclude = ["vqlab.agents.gui_static.bench*"]

[tool.setuptools.package-data]
vqlab = ["score/referee/*.txt", "score/referee/*.json", "score/referee/*.py", "*/CONTEXT.md", "*/*/CONTEXT.md",
         "runtime/*.json", "runtime/equivalent/*.txt", "family/*.json"]
"vqlab.agents.gui_static" = ["index.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: needs a real artifact; set VQLAB_MTP_MODEL",
    "gpu: needs a Metal GPU (custom Metal kernels or the GPU default device); `pytest -m \"not gpu\"` on a CPU-only machine",
    "lab: reads real lab artifacts or lab-only storage; deselected by default, run with `pytest -m lab`",
]
# The default run is what a fresh clone (and scripts/ci.sh) can answer. A later
# -m on the command line replaces this one: `pytest -m lab` runs only the lab
# tests, `pytest -m "lab or not lab"` runs everything, and a CPU-only machine runs
# `pytest -m "not gpu and not lab"`.
addopts = '-m "not lab"'

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Correctness (E, F, W, B), imports (I), modern syntax (UP) and the families that
# catch unpythonic or redundant code (SIM, C4, RET, PIE, PTH, ARG, PERF, FURB,
# RUF, PL). Rules that still had hits on 2026-10-14 are listed under
# extend-per-file-ignores so `ruff check` on the tree stays green;
# tests/test_quality_ratchet.py counts them with that list switched off and
# fails if any count rises. When a rule reaches zero, delete it from both.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RET", "PIE", "PTH", "ARG", "PERF", "FURB", "RUF", "PL"]
ignore = [
    "PLR0913",  # too many arguments: a signature is reviewed, not counted
    "PLR0917",  # too many positional arguments: same
    "PLR2004",  # magic value in comparison: named constants carry the unit instead
    "PLC0415",  # import inside a function: lazy imports are deliberate here (optional deps, cycles)
]

[tool.ruff.lint.per-file-ignores]
# The runtime files are spliced verbatim into published bundles, so a style
# rewrite there is a runtime change: only pyflakes and syntax errors gate them.
"src/vqlab/runtime/**" = ["E1", "E2", "E3", "E4", "E5", "E7", "W", "I", "B", "UP", "SIM",
                           "C4", "RET", "PIE", "PTH", "ARG", "PERF", "FURB", "RUF", "PL"]
"tests/**" = ["ARG"]  # fixtures and fakes take parameters they do not use

[tool.ruff.lint.extend-per-file-ignores]
# Ratchet baseline (2026-10-14): rules with pre-existing hits. Only shrinks.
"*" = [
