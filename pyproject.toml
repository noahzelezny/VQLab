[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vqlab"
version = "0.1.0"
description = "Size-targeted, data-free vector quantization of large models on Apple Silicon (MLX)"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["quantization", "vector-quantization", "mlx", "apple-silicon", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Development Status :: 4 - Beta",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
# Tested: the lab runs mlx 0.32.0.dev + mlx-lm 0.31.9; CI (scripts/ci.sh)
# installs the newest releases inside these ranges. The runtime bundled into
# every artifact (runtime/vq_switch.py) calls mlx Metal-kernel APIs, so mlx
# is capped at the next minor until CI has run on it.
dependencies = [
    "mlx>=0.32.0,<0.33",
    "mlx-lm>=0.31.0,<0.33",
    "numpy>=2.0",
    "safetensors>=0.4",
    # the architecture files (deepseek_v4, qwen4_exp, ...) and the runtime the
    # artifacts are served by: one copy, vqlab.family.arch loads them
    "knurlogic>=0.1.3",
]

[project.optional-dependencies]
# kl/ppl scoring and check-release's tokenizer round-trip
score = ["transformers>=4.57"]
test = ["pytest", "ruff", "build"]

[project.urls]
Homepage = "https://github.com/noahzelezny/VQLab"
Changelog = "https://github.com/noahzelezny/VQLab/blob/master/CHANGELOG.md"
Paper = "https://doi.org/10.5281/zenodo.22119017"
Models = "https://huggingface.co/TheDrainFlorist"

[project.scripts]
vqlab = "vqlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vqlab = ["score/referee/*.txt", "score/referee/*.json", "score/referee/*.py", "*/CONTEXT.md", "agents/gui_static/*.html",
         "agents/gui_static/bench/*", "runtime/*.json", "runtime/equivalent/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: needs a real artifact; set VQLAB_MTP_MODEL",
    "lab: reads real lab artifacts or lab-only storage; deselected by default, run with `pytest -m lab`",
]
# The default run is what a fresh clone (and scripts/ci.sh) can answer. A later
# -m on the command line replaces this one: `pytest -m lab` runs only the lab
# tests, `pytest -m "lab or not lab"` runs everything.
addopts = '-m "not lab"'

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Pyflakes (undefined names, unused imports, dead f-strings) and syntax
# errors. Style is not gated: the runtime files are spliced verbatim into
# published bundles, so reformatting them is a runtime change.
select = ["F", "E9"]
