[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vqlab"
version = "0.1.0"
description = "Size-targeted, data-free vector quantization of large models on Apple Silicon (MLX)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
# Tested: the lab runs mlx 0.32.0.dev + mlx-lm 0.31.9; CI (scripts/ci.sh)
# installs the newest releases inside these ranges. The runtime bundled into
# every artifact (runtime/vq_switch.py) calls mlx Metal-kernel APIs, so mlx
# is capped at the next minor until CI has run on it.
dependencies = [
    "mlx>=0.32.0,<0.33",
    "mlx-lm>=0.31.0,<0.33",
    "numpy>=2.0",
    "safetensors>=0.4",
]

[project.optional-dependencies]
# kl/ppl scoring and check-release's tokenizer round-trip
score = ["transformers>=4.57"]
test = ["pytest", "ruff", "build"]

[project.scripts]
vqlab = "vqlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vqlab = ["score/referee/*.txt", "score/referee/*.json", "score/referee/*.py", "*/CONTEXT.md", "agents/gui_static/*.html",
         "agents/gui_static/bench/*", "runtime/*.json", "runtime/equivalent/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: needs a real artifact; set VQLAB_MTP_MODEL"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Pyflakes (undefined names, unused imports, dead f-strings) and syntax
# errors. Style is not gated: the runtime files are spliced verbatim into
# published bundles, so reformatting them is a runtime change.
select = ["F", "E9"]
