[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vqlab"
version = "0.1.0"
description = "Size-targeted, data-free vector quantization of large models on Apple Silicon (MLX)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "mlx>=0.32.0",
    "mlx-lm",
    "numpy",
    "safetensors",
]

[project.optional-dependencies]
score = ["transformers"]

[project.scripts]
vqlab = "vqlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vqlab = ["referee/*.txt"]
