name: attribution

# The server-side copy of .githooks/pre-push's history check. Local hooks only
# guard a clone that enabled them; this runs on every push and pull request,
# whoever made it (another clone, a cloud session, a web merge), and fails on
# any commit authored or committed by an AI identity, or whose message carries
# an AI co-author trailer or names an AI model as author or reviewer, or that
# is authored or committed under anything but a GitHub noreply address. Patterns:
# .githooks/ai_identity.sh. It alerts (a failed run emails the pusher); the
# master ruleset blocks force pushes and deletion, so history can't be rewritten.
on:
  push:
  pull_request:

jobs:
  attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: no AI attribution in pushed commits
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          . .githooks/ai_identity.sh
          from="${BASE:-$BEFORE}"
          if [ -z "$from" ] || [ "$from" = 0000000000000000000000000000000000000000 ] \
             || ! git cat-file -e "$from" 2>/dev/null; then
            range="$HEAD"            # new branch or rewritten history: check all of it
          else
            range="$from..$HEAD"
          fi
          bad=0
          who=$(git log --format='%h %an <%ae> / %cn <%ce>' "$range" | grep -iE "$AI_IDENT" || true)
          if [ -n "$who" ]; then echo "AI identity in $range:"; echo "$who" | head -20; bad=1; fi
          msg=$(git log --format='%h %s%n%b' "$range" | grep -iE "$AI_NAMED" || true)
          if [ -n "$msg" ]; then echo "AI attribution in messages of $range:"; echo "$msg" | head -20; bad=1; fi
          # commits must carry a GitHub noreply address, never a personal one
          mail=$(git log --format='%h %ae / %ce' "$range" | grep -viE '^[0-9a-f]+ [^ ]*@users\.noreply\.github\.com / [^ ]*@users\.noreply\.github\.com$' || true)
          if [ -n "$mail" ]; then echo "non-noreply author or committer in $range:"; echo "$mail" | head -20; bad=1; fi
          exit $bad
