# Publish to PyPI when a version tag is pushed (v0.1.0 -> vqlab 0.1.0).
#
# Trusted Publishing: PyPI trusts this workflow, in this repository, in the
# `pypi` environment, to upload -- so no API token exists anywhere to leak.
# On pypi.org the project's publisher names: owner noahzelezny, repository
# VQLab, workflow publish.yml, environment pypi.
#
# The full suite and the installed-wheel selftest run locally before every
# push (.githooks/pre-push, scripts/ci.sh); this job only builds and uploads.
name: publish

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag is the version in pyproject.toml
        run: |
          want="${GITHUB_REF_NAME#v}"
          got=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$want" = "$got" || { echo "tag $GITHUB_REF_NAME, pyproject $got"; exit 1; }
      # Pure Python (mlx is a dependency, not built here), so one wheel from
      # Linux serves every Mac.
      - run: python -m pip install build twine
      - run: python -m build
      - name: The README renders on PyPI
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
