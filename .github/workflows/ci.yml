name: CI

# Manual only: the same suite runs locally before every push
# (.githooks/pre-push), so Actions minutes are spent only on request.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # MLX needs Apple Silicon.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The same script runs locally: scripts/ci.sh
      - run: scripts/ci.sh
        env:
          PYTHON: python
